<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>Tempo 浏览器 beta-1</title><link rel="stylesheet" href="styles.css"></head><body>
<header>
  <div class="tabstrip"><div class="brand"><span class="brand-mark">t</span><span>TEMPO</span></div><div id="tabs" role="tablist" aria-label="标签页"></div><button id="new" class="icon" title="新建标签页 Ctrl+T" aria-label="新建标签页">＋</button></div>
  <div class="toolbar"><div class="nav"><button id="back" class="icon" title="后退 Alt+←">←</button><button id="forward" class="icon" title="前进 Alt+→">→</button><button id="reload" class="icon" title="刷新 / 停止加载">↻</button><button id="home" class="icon" title="主页">⌂</button></div><form id="address-form"><span id="security" title="地址协议">⌕</span><input id="address" aria-label="地址或搜索关键词" placeholder="搜索，或输入网址" autocomplete="off" spellcheck="false"><button id="bookmark" type="button" title="添加 / 移除书签 Ctrl+D">☆</button></form><div class="tools"><button data-panel="bookmarks" class="icon" title="书签">☆</button><button data-panel="history" class="icon" title="历史 Ctrl+H">◷</button><button data-panel="downloads" class="icon" title="下载 Ctrl+J">↓<span id="download-badge"></span></button><button id="theme" class="icon" title="切换浅色 / 深色">◐</button><button data-panel="settings" class="icon" title="设置与帮助">☰</button></div></div>
  <div id="loading" aria-label="页面加载中"></div>
</header>
<div id="workspace"><main id="viewport"><div id="error" hidden><span class="error-symbol">!</span><h1>暂时无法打开这个页面</h1><p id="error-text"></p><button id="retry" class="primary">重新加载</button></div></main><aside id="panel" hidden><div class="panel-heading"><h2 id="panel-title"></h2><button id="panel-close" class="icon" aria-label="关闭面板">×</button></div><div id="panel-body"></div></aside></div>
<footer><div class="page-status"><span class="status-dot"></span><span id="page-status">准备就绪</span><span id="scope">媒体、动画与页面计时</span></div><section class="speed" aria-label="统一加速工具"><div class="speed-top"><label class="speed-toggle" for="acceleration-enabled"><input id="acceleration-enabled" type="checkbox">统一加速</label><span class="beta-tag">beta-1</span><strong id="rate">×1</strong><button id="reset" title="当前标签页恢复原速">恢复原速</button></div><div class="slider-row"><input id="speed" type="range" min="0" max="5" step="1" value="0" aria-label="统一加速倍率"><div id="stops"><span>×1</span><span>×2</span><span>×3</span><span>×5</span><span>×10</span><span>×20</span></div></div><div id="speed-status" role="status">统一加速已关闭</div></section></footer>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">请确认</h2><p id="confirm-message"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-yes" class="primary" value="confirm">确认继续</button></div></form></dialog>
<script src="renderer.js"></script></body></html>
